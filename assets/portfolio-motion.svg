<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">hcmus auto dkhp line-free portfolio visual</title>
  <desc id="desc">English ASCII-safe SVG visual for hcmus-auto-dkhp without moving connector lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <style>
      .title { font: 800 35px Segoe UI, Arial, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .subtitle { font: 650 19px Segoe UI, Arial, sans-serif; fill: #dbeafe; letter-spacing: 0; }
      .chipText { font: 800 15px Segoe UI, Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .caption { font: 700 16px Segoe UI, Arial, sans-serif; fill: #e2e8f0; letter-spacing: 0; }
      .panel { fill: rgba(15,23,42,.54); stroke: rgba(255,255,255,.20); stroke-width: 1.2; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; transform-origin: center; }
      .soft { animation: soft 4.8s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: .78; transform: scale(.99); } 50% { opacity: 1; transform: scale(1.02); } }
      @keyframes soft { 0%, 100% { opacity: .68; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)" />
  <rect x="38" y="34" width="1124" height="292" rx="22" class="panel" />
  <text x="72" y="66" class="title">HCMUS Course Registration Userscript</text>
  <text x="72" y="96" class="subtitle">Tampermonkey workflow support with scheduled reload, exact row</text>
  <text x="72" y="124" class="subtitle">matching, manual CAPTCHA boundaries and review-first submission.</text>
  <g>
    <g class="pulse"><rect x="76" y="248" width="190" height="48" rx="16" fill="#e0f2fe" /><text x="171" y="278" text-anchor="middle" class="chipText">Course Rows</text></g>
    <g class="pulse"><rect x="286" y="248" width="190" height="48" rx="16" fill="#dcfce7" /><text x="381" y="278" text-anchor="middle" class="chipText">HCMUS Portal</text></g>
    <g class="pulse"><rect x="496" y="248" width="190" height="48" rx="16" fill="#fef9c3" /><text x="591" y="278" text-anchor="middle" class="chipText">JavaScript</text></g>
    <g class="pulse"><rect x="706" y="248" width="190" height="48" rx="16" fill="#fee2e2" /><text x="801" y="278" text-anchor="middle" class="chipText">Tampermonkey</text></g>
    <g class="pulse"><rect x="916" y="248" width="210" height="48" rx="16" fill="#dbeafe" /><text x="1021" y="278" text-anchor="middle" class="chipText">Manual CAPTCHA</text></g>
  </g>
  <rect x="72" y="304" width="1056" height="28" rx="14" fill="rgba(15,23,42,.58)" />
  <text x="600.0" y="323" text-anchor="middle" class="caption">English visual asset - no connector lines - release-backed userscript evidence</text>
</svg>
